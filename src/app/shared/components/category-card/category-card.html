@let c = category();
<a class="cat" routerLink="/menu" [fragment]="c.id" [attr.aria-label]="'Ver ' + c.name + ' en el menú'">
  <figure class="cat__media">
    <img [src]="c.image" [alt]="c.name" [appImgFallback]="c.name" loading="lazy" decoding="async" width="480" height="640" />
  </figure>
  <div class="cat__body">
    <span class="cat__index">{{ number }}</span>
    <h3 class="cat__name display">{{ c.name }}</h3>
    <p class="cat__desc">{{ c.description }}</p>
    <span class="cat__count">
      @if (count() > 0) {
        {{ count() }} {{ count() === 1 ? 'platillo' : 'platillos' }}
      } @else {
        Pregunta por las opciones del día
      }
    </span>
  </div>
</a>
