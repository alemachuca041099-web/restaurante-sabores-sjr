@if (dishes().length) {
  <section class="section featured" id="especialidades" aria-labelledby="featured-title">
    <div class="container">
      <app-section-title eyebrow="Lo que nos distingue" title="Nuestros favoritos" accent="favoritos" />
    </div>

    <!-- Desktop/tablet: sticky stack, driven by the page's own scroll. -->
    <div class="container">
      <div class="pf-rows">
        <div class="pf-col pf-texts">
          @for (d of dishes(); track d.id; let i = $index) {
            <button type="button" class="pf-card" [style.--gi]="i" (click)="open(d)">
              <h3 class="pf-name display">{{ d.name }}</h3>
              <p class="pf-price display">{{ d.price | mxn }}</p>
              <p class="pf-desc">{{ d.description }}</p>
              @if (tagLabel(d); as tag) {
                <span class="pf-tag">{{ tag }}</span>
              }
            </button>
          }
          <div class="pf-spacer" aria-hidden="true"></div>
        </div>

        <div class="pf-col pf-shots">
          @for (d of dishes(); track d.id; let i = $index) {
            <button type="button" class="pf-shot" [style.--gi]="i" (click)="open(d)" [attr.aria-label]="'Ver ' + d.name">
              <img [src]="d.image" [alt]="d.name" [appImgFallback]="d.name" loading="lazy" decoding="async" width="600" height="600" />
              <span class="pf-veil" aria-hidden="true">
                <img src="assets/images/brand/logo.png" alt="" width="48" height="48" loading="lazy" />
              </span>
            </button>
          }
        </div>
      </div>
    </div>

    <!-- Mobile: one favorito at a time, swipe-only (no autoplay). -->
    <div class="container">
      <div
        class="featured__stage"
        (pointerdown)="carousel.onPointerDown($event)"
        (pointerup)="carousel.onPointerUp($event)"
        (pointercancel)="carousel.onPointerUp($event)"
      >
        <div class="featured__track" [style.transform]="'translateX(' + -carousel.index() * 100 + '%)'">
          @for (d of dishes(); track d.id; let i = $index) {
            <div class="featured__slide" [style]="tilt.styleFor(i)">
              <app-dish-card [dish]="d" variant="tile" [showCategory]="true" (select)="open($event)" />
            </div>
          }
        </div>
      </div>

      <app-rail-dots class="featured__dots" [count]="dishes().length" [active]="carousel.index()" (select)="carousel.to($event)" />
    </div>
  </section>
}
